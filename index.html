<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1F3D2B" />

    <title>Atmospheria – The Courtyard Kitchen | Open-air dining in Raipur</title>
    <meta
      name="description"
      content="Atmospheria – The Courtyard Kitchen is an open-air multi-cuisine restaurant on VIP Road, Raipur. Deck seating, couple's nooks and a garden café corner serving North Indian, Chinese, Italian and Continental. Where every table has a story."
    />
    <meta name="keywords" content="Atmospheria, Raipur restaurant, open air restaurant Raipur, VIP Road Raipur, courtyard dining, multi cuisine Raipur, kitty party Raipur, private dining Raipur" />

    <!-- Open Graph / social preview. Replace og-image with a courtyard wide shot from the Google Maps listing. -->
    <meta property="og:type" content="restaurant" />
    <meta property="og:title" content="Atmospheria – The Courtyard Kitchen, Raipur" />
    <meta property="og:description" content="Where every table has a story. Open-air multi-cuisine dining on VIP Road, Raipur." />
    <meta property="og:image" content="/images/ambience/courtyard-hero-01.jpg" />

    <!-- Structured data so Google can show hours, rating and address in the knowledge panel -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Restaurant",
        "name": "Atmospheria – The Courtyard Kitchen",
        "servesCuisine": ["North Indian", "Chinese", "Italian", "Continental"],
        "priceRange": "₹₹",
        "telephone": "+91-90000-00000",
        "url": "https://atmospheria-raipur.web.app/",
        "image": "https://atmospheria-raipur.web.app/images/ambience/courtyard-hero-01.jpg",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "VIP Road, Vishal Nagar",
          "addressLocality": "Raipur",
          "addressRegion": "Chhattisgarh",
          "postalCode": "492001",
          "addressCountry": "IN"
        },
        "openingHoursSpecification": [
          {
            "@type": "OpeningHoursSpecification",
            "dayOfWeek": ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"],
            "opens": "14:00",
            "closes": "23:59"
          }
        ],
        "aggregateRating": {
          "@type": "AggregateRating",
          "ratingValue": "4.4",
          "reviewCount": "4000"
        },
        "acceptsReservations": "True"
      }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Fraunces = display serif, Inter = body sans -->
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
